[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kma"
version = "0.1.0"
description = "Komodo Mlipir Algorithm (Suyanto et al., 2021): Python port verified against the MATLAB original"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["kma"]
